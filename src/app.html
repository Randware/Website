<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="author" content="Randware" />
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon-dark.svg"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon-light.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<style>
			@media (prefers-reduced-motion: no-preference) {
				:root[data-page-intro='pending'] #page-top,
				:root[data-page-intro='preparing'] #page-top {
					opacity: 0;
				}
			}
		</style>
		<script>
			const root = document.documentElement;
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') {
					root.dataset.theme = theme;
				}
			} catch {
				// The browser preference still applies when storage is unavailable.
			}

			if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
				root.dataset.pageIntro = 'pending';
				setTimeout(() => {
					// Keep the server-rendered page available if the app cannot start.
					if (root.dataset.pageIntro === 'pending') root.dataset.pageIntro = 'static';
				}, 2500);
			}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
